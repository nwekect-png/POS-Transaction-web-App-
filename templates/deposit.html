<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deposit Money - POS Transaction</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>💰 Deposit Money</h1>

        <p class="subtitle">
            Add money to your POS wallet
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {% if category == 'success' %}success{% endif %}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST" action="{{ url_for('deposit') }}">

            <label for="amount">
                Deposit Amount (₦)
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="Enter amount"
                min="1"
                step="0.01"
                required
            >

            <label for="transaction_pin">
                Transaction PIN
            </label>

            <input
                type="password"
                id="transaction_pin"
                name="transaction_pin"
                placeholder="Enter transaction PIN"
                maxlength="6"
                autocomplete="off"
            >

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Enter deposit description (optional)"
            ></textarea>

            <button type="submit">
                Deposit Money
            </button>

        </form>

        <div class="back">
            <a href="{{ url_for('dashboard') }}">
                ← Back to Dashboard
            </a>
        </div>

    </div>

</div>

</body>

</html>
